# Sample Focus Group Session Configuration
# This is an example - full implementation in Module 05

session_id: "sample-session-001"
title: "Product Feedback Focus Group"
description: "Gathering feedback on proposed mobile app features"

introductory_statement: |
  Thank you all for joining us today. We're here to discuss some new features
  we're considering for our mobile application. There are no right or wrong
  answers - we're simply interested in your honest opinions and experiences.
  Please feel free to agree or disagree with each other.

questions:
  - id: q1
    text: "How often do you currently use mobile apps for managing your daily tasks?"
    follow_up_prompts:
      - "Can you give us a specific example?"

  - id: q2
    text: "What frustrates you most about the apps you currently use?"

  - id: q3
    text: "If you could add one feature to your favorite app, what would it be?"

closing_question: "Any final thoughts you'd like to share about your experience today?"

demographics:
  - age_range: [25, 34]
    gender: "female"
    occupation: "Marketing Manager"
    location_type: "urban"
    interests: ["productivity", "fitness", "travel"]

  - age_range: [45, 55]
    gender: "male"
    occupation: "Small Business Owner"
    location_type: "suburban"
    interests: ["finance", "family", "sports"]

  - age_range: [18, 24]
    gender: "non-binary"
    occupation: "College Student"
    education_level: "some college"
    interests: ["social media", "gaming", "sustainability"]

model_config:
  primary:
    model_name: "llama3.1:8b-instruct-q4_K_M"
    base_url: "http://localhost:11434"
    num_ctx: 8192
    temperature: 0.7

max_context_tokens: 6000
summarize_after_tokens: 4000

output_directory: "./output/sessions/sample-001"
