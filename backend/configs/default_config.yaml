# Default Configuration for AI Focus Group Simulator

# Model settings
model:
  primary:
    provider: "ollama"
    model_name: "llama3.1:8b-instruct-q4_K_M"
    base_url: "http://localhost:11434"
    num_ctx: 8192
    temperature: 0.7

  # Optional fallback (uncomment and configure if needed)
  # fallback:
  #   provider: "anthropic"
  #   model_name: "claude-3-haiku-20240307"
  #   api_key_env_var: "ANTHROPIC_API_KEY"

  use_fallback_on_error: true
  max_retries: 3
  retry_delay_seconds: 1.0

# Context management
context:
  max_tokens: 6000
  summarize_after_tokens: 4000
  reserved_for_persona: 500
  reserved_for_question: 200
  reserved_for_recent_response: 1000

# Output settings
output:
  directory: "./output"
  save_debug_log: true
  save_clean_transcript: true
  log_format: "jsonl"  # jsonl, yaml, or json

# Session defaults
session:
  max_participants: 15
  max_questions: 20
  closing_question: "Do you have any concluding thoughts about participating in this focus group?"
