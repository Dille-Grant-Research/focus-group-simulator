# Focus Group Session - DeepSeek V3 with Memory System Enabled
# Run with: python -m focus_group run configs/my_session_deepseek_memory.yaml --verbose
# Requires: DEEPSEEK_API_KEY environment variable

# Demographics for participant generation
demographics:
  - "Female, 30-40, professional baker"
  - "Male, 50-60, google engineer"
  - "Non-binary, 25-35, stay-at-home mom"

# Questions to discuss
questions:
  - "What do you think is the ideal work-life balance?"
  - "How do you stay productive when you feel low on energy?"
  - "What challenges have you faced with finding meaningful work?"

# Purpose/introductory statement
purpose: "We're here today to discuss experiences and perspectives on work."

# Custom closing question
closing_question: "Do you have any final thoughts about participating in this discussion?"

# Session name
session_name: "memory_test_deepseek"

# LLM Model configuration (DeepSeek V3 cloud API)
model:
  provider: "openai"
  model_name: "deepseek-chat"
  api_key_env_var: "DEEPSEEK_API_KEY"
  base_url: "https://api.deepseek.com"
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  num_ctx: 8192

# Context window management
context:
  max_tokens: 6000
  summarize_after_tokens: 4000
  reserved_for_persona: 500
  reserved_for_question: 200
  reserved_for_recent_response: 1000

# Three-tier memory system (NEW)
memory:
  working_memory_window: 10
  enable_stance_tracking: true
  question_history_limit: 5

# Output configuration
output:
  directory: "./output"
  save_debug_log: true
  save_clean_transcript: true
  log_format: "jsonl"

# Persona validation
validate_personas: true
